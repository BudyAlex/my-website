<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

        :root {
            --primary: #c8102e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0a0f1c;
            color: #e2e8f0;
        }

        /* NAVBAR */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 2px solid var(--primary);
            z-index: 1000;
        }

        .nav-container {
            max-width: 1400px;
            margin: auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
        }

        .logo span {
            color: var(--primary);
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.85)),
            url('https://picsum.photos/id/1015/2000/1200') center/cover;
            display: flex;
            align-items: center;
            text-align: center;
            padding-top: 80px;
        }

        .hero h1 {
            font-size: 3.5rem;
        }

        .highlight {
            color: var(--primary);
        }

        .phone-big {
            display: inline-block;
            margin-top: 20px;
            background: var(--primary);
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 1.8rem;
            text-decoration: none;
            font-weight: bold;
        }

        /* SERVICES */
        .services {
            padding: 80px 20px;
            background: #0f172a;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .service-card {
            background: #1e2937;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            transition: 0.3s;
        }

        .service-card:hover {
            transform: translateY(-8px);
        }

        .service-card i {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        /* ABOUT */
        .about {
            padding: 80px 20px;
            background: #111827;
        }

        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            max-width: 1200px;
            margin: auto;
            align-items: center;
        }

        .about img {
            width: 100%;
            border-radius: 20px;
        }

        /* GALLERY */
        .gallery {
            padding: 80px 20px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
        }

        /* CONTACT */
        .contact {
            padding: 80px 20px;
            background: #1a2538;
            text-align: center;
        }

        .phone-number {
            font-size: 2rem;
            color: var(--primary);
            font-weight: bold;
            display: block;
            margin: 15px 0;
            text-decoration: none;
        }

        .map iframe {
            width: 100%;
            height: 450px;
            border-radius: 20px;
        }

        /* WHATSAPP */
        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #25D366;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            z-index: 9999;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .about-content { grid-template-columns: 1fr; }
        }
    </style>
</head>
