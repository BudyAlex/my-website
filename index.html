<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأسطى محمد جلال | ميكانيكي سيارات محترف</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

        :root {
            --primary: #c8102e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0a0f1c;
            color: #e2e8f0;
            line-height: 1.6;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.98);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 2px solid var(--primary);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.9rem;
            font-weight: 900;
            color: white;
        }

        .logo span {
            color: var(--primary);
        }

        .hero {
            min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)),
            url('https://picsum.photos/id/1015/2000/1200') center/cover no-repeat;
            display: flex;
            align-items: center;
            text-align: center;
        }

        .hero-content {
            width: 100%;
        }

        .hero h1 {
            font-size: 3.5rem;
        }

        .highlight {
            color: var(--primary);
        }

        .phone-big {
            display: inline-block;
            margin-top: 20px;
            background: var(--primary);
            color: #fff;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 2rem;
            font-weight: bold;
            text-decoration: none;
        }

        .services {
            padding: 80px 20px;
            background: #0f172a;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .service-card {
            background: #1e2937;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            transition: 0.3s;
        }

        .service-card:hover {
            transform: translateY(-8px);
        }

        .service-card i {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .contact {
            padding: 80px 20px;
            background: #1a2538;
            text-align: center;
        }

        .phone-number {
            font-size: 2rem;
            color: var(--primary);
            font-weight: bold;
            display: block;
            margin: 15px 0;
            text-decoration: none;
        }

        .map {
            margin-top: 30px;
        }

        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #25D366;
            color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            z-index: 9999;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar">

<!-- Hero -->
<section class="hero">

        <p>أكثر من 30 سنة خبرة</p>
        <a href="tel:010674666793" class="phone-big">📞 0106 7466 793</a>

<!-- Services -->
<section class="services">
    <div class="services-grid">

        <div class="service-card">
            <i class="fas fa-cogs"></i>

        </div>

        <div class="service-card">
            <i class="fas fa-car"></i>
            <h3>صيانة دورية</h3>
        </div>

        <div class="service-card">
            <i class="fas fa-gears"></i>
            <h3>ناقل الحركة</h3>
        </div>

        <div class="service-card">
            <i class="fas fa-bolt"></i>

    </div>
</section>

<!-- Contact -->

    <!-- Google Map -->

        <iframe
            src="https://www.google.com/maps?q=30.1806583,31.4435733&z=17&hl=en&output=embed"

</section>

<!-- WhatsApp -->
<a href="https://wa.me/2010674666793" class="whatsapp-float">
    <i class="fab fa-whatsapp"></i>
</a>

</body>
</html>
